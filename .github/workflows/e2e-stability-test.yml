name: E2E Stability Test

on:
  # Allow manual triggering to start a new stability test
  workflow_dispatch:
    inputs:
      duration_hours:
        description: 'Duration to run tests in hours (max 24)'
        required: true
        default: '24'
      wp_version:
        description: 'WordPress version to test'
        required: true
        default: 'latest'
      amp_version:
        description: 'AMP version to test (leave empty for none)'
        required: false
        default: ''
  
  # Schedule to run every 30 minutes
  # schedule:
  #   - cron: '27,57 * * * *'
  
  # Allow being called from other workflows
  workflow_call:
    inputs:
      duration_hours:
        description: 'Duration to run tests in hours (max 24)'
        type: number
        required: false
        default: 24
      wp_version:
        description: 'WordPress version to test'
        type: string
        required: false
        default: 'latest'
      amp_version:
        description: 'AMP version to test (leave empty for none)'
        type: string
        required: false
        default: ''

jobs:
  # Check if we should run a stability test
  check-stability-test:
    name: Check Stability Test Status
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      wp_version: ${{ steps.check.outputs.wp_version }}
      amp_version: ${{ steps.check.outputs.amp_version }}
      run_count: ${{ steps.check.outputs.run_count }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stability-test-results
          fetch-depth: 1
          
      - name: Check if stability test is in progress
        id: check
        run: |
          # Default values
          echo "should_run=false" >> $GITHUB_OUTPUT
          echo "wp_version=latest" >> $GITHUB_OUTPUT
          echo "amp_version=" >> $GITHUB_OUTPUT
          echo "run_count=0" >> $GITHUB_OUTPUT
          
          # If this is a manual trigger, always start a new test
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Starting new stability test via manual trigger"
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "wp_version=${{ github.event.inputs.wp_version }}" >> $GITHUB_OUTPUT
            echo "amp_version=${{ github.event.inputs.amp_version }}" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Check if stability-test-config.json exists
          if [ -f "stability-test-config.json" ]; then
            # Read config
            START_TIME=$(jq -r '.start_time' stability-test-config.json)
            DURATION_HOURS=$(jq -r '.duration_hours' stability-test-config.json)
            WP_VERSION=$(jq -r '.wp_version' stability-test-config.json)
            AMP_VERSION=$(jq -r '.amp_version' stability-test-config.json)
            RUN_COUNT=$(jq -r '.run_count' stability-test-config.json)
            
            # Calculate end time
            END_TIME=$((START_TIME + DURATION_HOURS * 3600))
            CURRENT_TIME=$(date +%s)
            
            # Check if we're still within the test duration
            if [[ $CURRENT_TIME -lt $END_TIME ]]; then
              echo "Continuing existing stability test"
              echo "should_run=true" >> $GITHUB_OUTPUT
              echo "wp_version=$WP_VERSION" >> $GITHUB_OUTPUT
              echo "amp_version=$AMP_VERSION" >> $GITHUB_OUTPUT
              echo "run_count=$RUN_COUNT" >> $GITHUB_OUTPUT
            else
              echo "Stability test duration completed"
            fi
          fi

  # Run a single E2E test if needed
  e2e-stability-test:
    name: E2E Stability Test (WordPress ${{ needs.check-stability-test.outputs.wp_version }}${{ needs.check-stability-test.outputs.amp_version && ', AMP ' }}${{ needs.check-stability-test.outputs.amp_version }})
    needs: check-stability-test
    if: needs.check-stability-test.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30  # Single test run should complete within 30 minutes
    permissions:
      contents: write  # For committing results back to repo
    
    env:
      AMP_VERSION: ${{ needs.check-stability-test.outputs.amp_version }}
      WP_VERSION: ${{ needs.check-stability-test.outputs.wp_version }}
      RUN_COUNT: ${{ needs.check-stability-test.outputs.run_count }}
      
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js (.nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      
      - name: Install npm Globally
        run: npm run install-global-npm
      
      - name: npm install
        run: npm ci
      
      - name: Build
        run: npm run build:test
      
      # E2E tests use a dedicated container, this is just for Composer.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: composer:2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      
      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-
      
      - name: Composer Install
        run: composer install --no-interaction --no-progress --no-dev
      
      - name: Fetch existing results
        id: fetch_results
        continue-on-error: true
        run: |
          # Try to checkout the stability-test-results branch
          git fetch origin stability-test-results || true
          git checkout stability-test-results || git checkout -b stability-test-results
          
          # Create directories if they don't exist
          mkdir -p test-results
          
          # Initialize results file if it doesn't exist
          if [ ! -f "test-results/e2e-stability-results.json" ]; then
            echo "[]" > test-results/e2e-stability-results.json
          fi
          
          # Initialize config file if it doesn't exist or if this is a manual trigger
          if [ ! -f "stability-test-config.json" ] || [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            # For manual trigger, create a new config
            if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
              echo "{\"start_time\": $(date +%s), \"duration_hours\": ${{ github.event.inputs.duration_hours }}, \"wp_version\": \"${{ github.event.inputs.wp_version }}\", \"amp_version\": \"${{ github.event.inputs.amp_version }}\", \"run_count\": 0}" > stability-test-config.json
            else
              # For scheduled runs, use the values from the check job
              echo "{\"start_time\": $(date +%s), \"duration_hours\": 24, \"wp_version\": \"${{ env.WP_VERSION }}\", \"amp_version\": \"${{ env.AMP_VERSION }}\", \"run_count\": ${{ env.RUN_COUNT }}}" > stability-test-config.json
            fi
          fi
          
          # Update run count
          NEW_RUN_COUNT=$((RUN_COUNT + 1))
          echo "NEW_RUN_COUNT=$NEW_RUN_COUNT" >> $GITHUB_ENV
          
          # Update config with new run count
          jq ".run_count = $NEW_RUN_COUNT" stability-test-config.json > temp.json && mv temp.json stability-test-config.json
      
      - name: Run single E2E test
        id: run_test
        run: |
          echo "=== Starting test run #$RUN_COUNT at $(date) ==="
          
          # Start environment fresh for this run
          npm run env:start
          
          # Run the E2E tests and capture output
          TEST_START_TIME=$(date +%s)
          TEST_OUTPUT=$(npm run test:e2e 2>&1) || true
          TEST_STATUS=$?
          TEST_END_TIME=$(date +%s)
          TEST_DURATION=$((TEST_END_TIME - TEST_START_TIME))
          
          # Record results
          TIMESTAMP=$(date +"%Y-%m-%d %H:%M:%S")
          jq --arg timestamp "$TIMESTAMP" \
             --arg run_number "$RUN_COUNT" \
             --argjson status "$TEST_STATUS" \
             --argjson duration "$TEST_DURATION" \
             --arg output "$TEST_OUTPUT" \
             '. += [{"timestamp": $timestamp, "run_number": $run_number, "status": $status, "duration": $duration, "output": $output}]' \
             test-results/e2e-stability-results.json > temp.json && mv temp.json test-results/e2e-stability-results.json
          
          # Generate summary stats
          TOTAL_RUNS=$NEW_RUN_COUNT
          SUCCESS_COUNT=$(jq '[.[] | select(.status == 0)] | length' test-results/e2e-stability-results.json)
          FAILURE_COUNT=$(jq '[.[] | select(.status != 0)] | length' test-results/e2e-stability-results.json)
          SUCCESS_RATE=$(echo "scale=2; ($SUCCESS_COUNT / $TOTAL_RUNS) * 100" | bc)
          
          echo "=== Test run #$RUN_COUNT completed with status $TEST_STATUS ==="
          echo "=== Summary: $SUCCESS_COUNT/$TOTAL_RUNS successful ($SUCCESS_RATE% success rate) ==="
          
          # Generate summary file
          echo "### E2E Stability Test Summary" > test-results/summary.md
          echo "- Total runs: $TOTAL_RUNS" >> test-results/summary.md
          echo "- Successful runs: $SUCCESS_COUNT" >> test-results/summary.md
          echo "- Failed runs: $FAILURE_COUNT" >> test-results/summary.md
          echo "- Success rate: $SUCCESS_RATE%" >> test-results/summary.md
          
          # Create CSV for easier analysis
          echo "run_number,timestamp,status,duration" > test-results/e2e-stability-results.csv
          jq -r '.[] | [.run_number, .timestamp, .status, .duration] | @csv' test-results/e2e-stability-results.json >> test-results/e2e-stability-results.csv
      
      - name: Commit results back to repository
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add test-results/ stability-test-config.json
          git commit -m "Update E2E stability test results (run #$RUN_COUNT) [skip ci]"
          git push origin stability-test-results
        
      - name: Upload results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: e2e-stability-results-run-${{ env.RUN_COUNT }}
          path: test-results/
          
  # Generate final report when test duration is complete
  generate-final-report:
    name: Generate Final Stability Test Report
    runs-on: ubuntu-latest
    needs: check-stability-test
    if: needs.check-stability-test.outputs.should_run == 'false'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stability-test-results
          fetch-depth: 1
      
      - name: Check if test results exist
        id: check_results
        run: |
          if [ -f "test-results/e2e-stability-results.json" ] && [ -f "stability-test-config.json" ]; then
            echo "results_exist=true" >> $GITHUB_OUTPUT
          else
            echo "results_exist=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Generate final report
        if: steps.check_results.outputs.results_exist == 'true'
        run: |
          # Calculate final statistics
          TOTAL_RUNS=$(jq '. | length' test-results/e2e-stability-results.json)
          SUCCESS_COUNT=$(jq '[.[] | select(.status == 0)] | length' test-results/e2e-stability-results.json)
          FAILURE_COUNT=$(jq '[.[] | select(.status != 0)] | length' test-results/e2e-stability-results.json)
          SUCCESS_RATE=$(echo "scale=2; ($SUCCESS_COUNT / $TOTAL_RUNS) * 100" | bc)
          AVG_DURATION=$(jq '[.[] | .duration] | add / length' test-results/e2e-stability-results.json)
          
          # Generate final summary
          echo "### E2E Stability Test Final Report" > test-results/final-report.md
          echo "- Test completed at: $(date)" >> test-results/final-report.md
          echo "- Total runs: $TOTAL_RUNS" >> test-results/final-report.md
          echo "- Successful runs: $SUCCESS_COUNT" >> test-results/final-report.md
          echo "- Failed runs: $FAILURE_COUNT" >> test-results/final-report.md
          echo "- Success rate: $SUCCESS_RATE%" >> test-results/final-report.md
          echo "- Average duration: $AVG_DURATION seconds" >> test-results/final-report.md
          
          # Update summary.md with final report
          cp test-results/final-report.md test-results/summary.md
          
          # Commit final report
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add test-results/
          git commit -m "Add E2E stability test final report [skip ci]"
          git push origin stability-test-results
          
          # Clean up config to indicate test is complete
          rm stability-test-config.json
          git add -u
          git commit -m "Clean up stability test config [skip ci]"
          git push origin stability-test-results
      
      - name: Upload final results as artifact
        if: steps.check_results.outputs.results_exist == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-stability-final-results
          path: test-results/
