name: Backstop Stability Test

on:
  # Allow manual triggering to start a new stability test
  workflow_dispatch:
    inputs:
      duration_hours:
        description: 'Duration to run tests in hours (max 24)'
        required: true
        default: '24'
      wp_version:
        description: 'WordPress version to test'
        required: true
        default: 'latest'
      amp_version:
        description: 'AMP version to test (leave empty for none)'
        required: false
        default: ''
  
  # Schedule to run every 30 minutes
  schedule:
    - cron: '17,47 * * * *'
  
  # Allow being called from other workflows
  workflow_call:
    inputs:
      duration_hours:
        description: 'Duration to run tests in hours (max 24)'
        type: number
        required: false
        default: 24
      wp_version:
        description: 'WordPress version to test'
        type: string
        required: false
        default: 'latest'
      amp_version:
        description: 'AMP version to test (leave empty for none)'
        type: string
        required: false
        default: ''

jobs:
  # Check if we should run a stability test
  check-stability-test:
    name: Check Stability Test Status
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      wp_version: ${{ steps.check.outputs.wp_version }}
      amp_version: ${{ steps.check.outputs.amp_version }}
      run_count: ${{ steps.check.outputs.run_count }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: backstop-stability-test-results
          fetch-depth: 1
          
      - name: Check if stability test is in progress
        id: check
        run: |
          # Default values
          echo "should_run=false" >> $GITHUB_OUTPUT
          echo "wp_version=latest" >> $GITHUB_OUTPUT
          echo "amp_version=" >> $GITHUB_OUTPUT
          echo "run_count=0" >> $GITHUB_OUTPUT
          
          # If this is a manual trigger, always start a new test
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Starting new stability test via manual trigger"
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "wp_version=${{ github.event.inputs.wp_version }}" >> $GITHUB_OUTPUT
            echo "amp_version=${{ github.event.inputs.amp_version }}" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Check if backstop-stability-test-config.json exists
          if [ -f "backstop-stability-test-config.json" ]; then
            # Read config
            START_TIME=$(jq -r '.start_time' backstop-stability-test-config.json)
            DURATION_HOURS=$(jq -r '.duration_hours' backstop-stability-test-config.json)
            WP_VERSION=$(jq -r '.wp_version' backstop-stability-test-config.json)
            AMP_VERSION=$(jq -r '.amp_version' backstop-stability-test-config.json)
            RUN_COUNT=$(jq -r '.run_count' backstop-stability-test-config.json)
            
            # Calculate end time
            END_TIME=$((START_TIME + DURATION_HOURS * 3600))
            CURRENT_TIME=$(date +%s)
            
            # Check if we're still within the test duration
            if [[ $CURRENT_TIME -lt $END_TIME ]]; then
              echo "Continuing existing stability test"
              echo "should_run=true" >> $GITHUB_OUTPUT
              echo "wp_version=$WP_VERSION" >> $GITHUB_OUTPUT
              echo "amp_version=$AMP_VERSION" >> $GITHUB_OUTPUT
              echo "run_count=$RUN_COUNT" >> $GITHUB_OUTPUT
            else
              echo "Stability test duration completed"
            fi
          fi

  # Run a single backstop test if needed
  backstop-stability-test:
    name: Backstop Stability Test (WordPress ${{ needs.check-stability-test.outputs.wp_version }}${{ needs.check-stability-test.outputs.amp_version && ', AMP ' }}${{ needs.check-stability-test.outputs.amp_version }})
    needs: check-stability-test
    if: needs.check-stability-test.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30  # Single test run should complete within 30 minutes
    permissions:
      contents: write  # For committing results back to repo
    
    env:
      AMP_VERSION: ${{ needs.check-stability-test.outputs.amp_version }}
      WP_VERSION: ${{ needs.check-stability-test.outputs.wp_version }}
      RUN_COUNT: ${{ needs.check-stability-test.outputs.run_count }}
      
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js (.nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      
      - name: Install npm Globally
        run: npm run install-global-npm
      
      - name: npm install
        run: npm ci

      - name: Fetch existing results
        id: fetch_results
        continue-on-error: true
        run: |
          # Try to checkout the backstop-stability-test-results branch
          git fetch origin backstop-stability-test-results || true
          git checkout backstop-stability-test-results || git checkout -b backstop-stability-test-results
          
          # Create directories if they don't exist
          mkdir -p test-results
          
          # Initialize results file if it doesn't exist
          if [ ! -f "test-results/backstop-stability-results.json" ]; then
            echo "[]" > test-results/backstop-stability-results.json
          fi
          
          # Initialize config file if it doesn't exist or if this is a manual trigger
          if [ ! -f "backstop-stability-test-config.json" ] || [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            # For manual trigger, create a new config
            if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
              echo "{\"start_time\": $(date +%s), \"duration_hours\": ${{ github.event.inputs.duration_hours }}, \"wp_version\": \"${{ github.event.inputs.wp_version }}\", \"amp_version\": \"${{ github.event.inputs.amp_version }}\", \"run_count\": 0}" > backstop-stability-test-config.json
            else
              # For scheduled runs, use the values from the check job
              echo "{\"start_time\": $(date +%s), \"duration_hours\": 24, \"wp_version\": \"${{ env.WP_VERSION }}\", \"amp_version\": \"${{ env.AMP_VERSION }}\", \"run_count\": ${{ env.RUN_COUNT }}}" > backstop-stability-test-config.json
            fi
          fi
          
          # Update run count
          NEW_RUN_COUNT=$((RUN_COUNT + 1))
          echo "NEW_RUN_COUNT=$NEW_RUN_COUNT" >> $GITHUB_ENV
          
          # Update config with new run count
          jq ".run_count = $NEW_RUN_COUNT" backstop-stability-test-config.json > temp.json && mv temp.json backstop-stability-test-config.json
      
      - name: Run single backstop test
        id: run_test
        run: |
          echo "=== Starting test run #$RUN_COUNT at $(date) ==="
          
          # Create output directory for this run
          mkdir -p test-results/run-$RUN_COUNT
          
          # Run the backstop tests and capture output
          TEST_START_TIME=$(date +%s)
          TEST_OUTPUT=$(npm run test:visualtest 2>&1) || true
          TEST_STATUS=$?
          TEST_END_TIME=$(date +%s)
          TEST_DURATION=$((TEST_END_TIME - TEST_START_TIME))
          
          # Save the test output to a file
          echo "$TEST_OUTPUT" > test-results/run-$RUN_COUNT/output.txt
          
          # Copy the JSON report if it exists
          if [ -f "tests/backstop/json_report/jsonReport.json" ]; then
            cp tests/backstop/json_report/jsonReport.json test-results/run-$RUN_COUNT/report.json
          else
            echo "{\"error\": \"No report generated\"}" > test-results/run-$RUN_COUNT/report.json
          fi
          
          # Extract error message if test failed
          ERROR_MSG=""
          if [ $TEST_STATUS -ne 0 ]; then
            # Extract the error message from the output
            ERROR_MSG=$(echo "$TEST_OUTPUT" | grep -A 10 "Error:" | head -n 10 | sed 's/"/\\"/g' | tr '\n' ' ')
          fi
          
          # Record results
          TIMESTAMP=$(date +"%Y-%m-%d %H:%M:%S")
          jq --arg timestamp "$TIMESTAMP" \
             --arg run_number "$RUN_COUNT" \
             --argjson status "$TEST_STATUS" \
             --argjson duration "$TEST_DURATION" \
             --arg error "$ERROR_MSG" \
             --arg output "$TEST_OUTPUT" \
             '. += [{"timestamp": $timestamp, "run_number": $run_number, "status": $status, "duration": $duration, "error": $error, "output": $output}]' \
             test-results/backstop-stability-results.json > temp.json && mv temp.json test-results/backstop-stability-results.json
          
          # Generate summary stats
          TOTAL_RUNS=$NEW_RUN_COUNT
          SUCCESS_COUNT=$(jq '[.[] | select(.status == 0)] | length' test-results/backstop-stability-results.json)
          FAILURE_COUNT=$(jq '[.[] | select(.status != 0)] | length' test-results/backstop-stability-results.json)
          SUCCESS_RATE=$(echo "scale=2; ($SUCCESS_COUNT / $TOTAL_RUNS) * 100" | bc)
          
          echo "=== Test run #$RUN_COUNT completed with status $TEST_STATUS ==="
          echo "=== Summary: $SUCCESS_COUNT/$TOTAL_RUNS successful ($SUCCESS_RATE% success rate) ==="
          
          # Generate summary file
          echo "### Backstop Stability Test Summary" > test-results/summary.md
          echo "- Total runs: $TOTAL_RUNS" >> test-results/summary.md
          echo "- Successful runs: $SUCCESS_COUNT" >> test-results/summary.md
          echo "- Failed runs: $FAILURE_COUNT" >> test-results/summary.md
          echo "- Success rate: $SUCCESS_RATE%" >> test-results/summary.md
          
          # Create CSV for easier analysis
          echo "run_number,timestamp,status,duration,error" > test-results/backstop-stability-results.csv
          jq -r '.[] | [.run_number, .timestamp, .status, .duration, .error] | @csv' test-results/backstop-stability-results.json >> test-results/backstop-stability-results.csv
      
      - name: Commit results back to repository
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add test-results/ backstop-stability-test-config.json
          git commit -m "Update backstop stability test results (run #$RUN_COUNT) [skip ci]"
          git push origin backstop-stability-test-results
        
      - name: Upload results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: backstop-stability-results-run-${{ env.RUN_COUNT }}
          path: test-results/
          
  # Generate final report when test duration is complete
  generate-final-report:
    name: Generate Final Stability Test Report
    runs-on: ubuntu-latest
    needs: check-stability-test
    if: needs.check-stability-test.outputs.should_run == 'false'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: backstop-stability-test-results
          fetch-depth: 1
      
      - name: Check if test results exist
        id: check_results
        run: |
          if [ -f "test-results/backstop-stability-results.json" ] && [ -f "backstop-stability-test-config.json" ]; then
            echo "results_exist=true" >> $GITHUB_OUTPUT
          else
            echo "results_exist=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Generate final report
        if: steps.check_results.outputs.results_exist == 'true'
        run: |
          # Calculate final statistics
          TOTAL_RUNS=$(jq '. | length' test-results/backstop-stability-results.json)
          SUCCESS_COUNT=$(jq '[.[] | select(.status == 0)] | length' test-results/backstop-stability-results.json)
          FAILURE_COUNT=$(jq '[.[] | select(.status != 0)] | length' test-results/backstop-stability-results.json)
          SUCCESS_RATE=$(echo "scale=2; ($SUCCESS_COUNT / $TOTAL_RUNS) * 100" | bc)
          AVG_DURATION=$(jq '[.[] | .duration] | add / length' test-results/backstop-stability-results.json)
          
          # Generate final summary
          echo "### Backstop Stability Test Final Report" > test-results/final-report.md
          echo "- Test completed at: $(date)" >> test-results/final-report.md
          echo "- Total runs: $TOTAL_RUNS" >> test-results/final-report.md
          echo "- Successful runs: $SUCCESS_COUNT" >> test-results/final-report.md
          echo "- Failed runs: $FAILURE_COUNT" >> test-results/final-report.md
          echo "- Success rate: $SUCCESS_RATE%" >> test-results/final-report.md
          echo "- Average duration: $AVG_DURATION seconds" >> test-results/final-report.md
          
          # Add error details section if there were any failures
          if [ "$FAILURE_COUNT" -gt 0 ]; then
            echo "" >> test-results/final-report.md
            echo "### Error Details" >> test-results/final-report.md
            echo "" >> test-results/final-report.md
            echo "| Run | Timestamp | Error |" >> test-results/final-report.md
            echo "|-----|-----------|-------|" >> test-results/final-report.md
            
            # Add each error to the table
            jq -r '.[] | select(.status != 0) | [.run_number, .timestamp, .error] | @tsv' test-results/backstop-stability-results.json | \
            while IFS=$'\t' read -r run timestamp error; do
              printf "| %s | %s | %s |\n" "$run" "$timestamp" "$error" >> test-results/final-report.md
            done
          fi
          
          # Update summary.md with final report
          cp test-results/final-report.md test-results/summary.md
          
          # Commit final report
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add test-results/
          git commit -m "Add backstop stability test final report [skip ci]"
          git push origin backstop-stability-test-results
          
          # Clean up config to indicate test is complete
          rm backstop-stability-test-config.json
          git add -u
          git commit -m "Clean up backstop stability test config [skip ci]"
          git push origin backstop-stability-test-results
      
      - name: Upload final results as artifact
        if: steps.check_results.outputs.results_exist == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: backstop-stability-final-results
          path: test-results/
