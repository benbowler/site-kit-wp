name: Backstop Performance Test

on:
  # Allow manual triggering to start a new performance test
  workflow_dispatch:
    inputs:
      test_parameter:
        description: 'Parameter to test (asyncCaptureLimit or asyncCompareLimit)'
        required: true
        default: 'asyncCaptureLimit'
        type: choice
        options:
          - asyncCaptureLimit
          - asyncCompareLimit
      min_value:
        description: 'Minimum value for the parameter'
        required: true
        default: '5'
        type: string
      max_value:
        description: 'Maximum value for the parameter'
        required: true
        default: '50'
        type: string
      interval:
        description: 'Increment between test values'
        required: true
        default: '10'
        type: string
      wp_version:
        description: 'WordPress version to test'
        required: true
        default: 'latest'
        type: string
      amp_version:
        description: 'AMP version to test (leave empty for none)'
        required: false
        default: ''
        type: string

jobs:
  # Setup job to prepare the test matrix
  setup:
    name: Setup Test Matrix
    runs-on: ubuntu-latest
    outputs:
      test_matrix: ${{ steps.generate-matrix.outputs.test_matrix }}
      test_parameter: ${{ steps.setup-config.outputs.test_parameter }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup test configuration
        id: setup-config
        run: |
          echo "test_parameter=${{ github.event.inputs.test_parameter }}" >> $GITHUB_OUTPUT
          
          # Validate inputs
          MIN_VALUE=${{ github.event.inputs.min_value }}
          MAX_VALUE=${{ github.event.inputs.max_value }}
          INTERVAL=${{ github.event.inputs.interval }}
          
          if ! [[ "$MIN_VALUE" =~ ^[0-9]+$ ]]; then
            echo "Error: min_value must be a positive integer"
            exit 1
          fi
          
          if ! [[ "$MAX_VALUE" =~ ^[0-9]+$ ]]; then
            echo "Error: max_value must be a positive integer"
            exit 1
          fi
          
          if ! [[ "$INTERVAL" =~ ^[0-9]+$ ]]; then
            echo "Error: interval must be a positive integer"
            exit 1
          fi
          
          if [ "$MIN_VALUE" -gt "$MAX_VALUE" ]; then
            echo "Error: min_value cannot be greater than max_value"
            exit 1
          fi
          
          if [ "$INTERVAL" -le 0 ]; then
            echo "Error: interval must be greater than 0"
            exit 1
          fi
      
      - name: Generate test matrix
        id: generate-matrix
        run: |
          MIN_VALUE=${{ github.event.inputs.min_value }}
          MAX_VALUE=${{ github.event.inputs.max_value }}
          INTERVAL=${{ github.event.inputs.interval }}
          
          # Generate array of values to test
          VALUES=()
          for ((i=MIN_VALUE; i<=MAX_VALUE; i+=INTERVAL)); do
            VALUES+=($i)
          done
          
          # Create JSON array for matrix
          JSON_ARRAY=$(printf '"%s",' "${VALUES[@]}")
          JSON_ARRAY="[${JSON_ARRAY%,}]"
          
          echo "test_matrix=${JSON_ARRAY}" >> $GITHUB_OUTPUT
          echo "Generated test matrix: ${JSON_ARRAY}"

  # Run tests for each parameter value
  run-tests:
    name: Test ${{ needs.setup.outputs.test_parameter }} = ${{ matrix.value }}
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      matrix:
        value: ${{ fromJson(needs.setup.outputs.test_matrix) }}
      fail-fast: false
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js (.nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      
      - name: Install npm Globally
        run: npm run install-global-npm
      
      - name: npm install
        run: npm ci
      
      - name: Build
        run: npm run build:test
      
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: composer:2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      
      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-
      
      - name: Composer Install
        run: composer install --no-interaction --no-progress --no-dev
      
      - name: Modify backstop config
        run: |
          # Create a backup of the original config
          cp tests/backstop/config.js tests/backstop/config.js.bak
          
          # Update the config with the test parameter value
          TEST_PARAM="${{ needs.setup.outputs.test_parameter }}"
          TEST_VALUE="${{ matrix.value }}"
          
          # Use sed to replace the parameter value in the config file
          sed -i "s/\(${TEST_PARAM}: \)[0-9]\+/\1${TEST_VALUE}/" tests/backstop/config.js
          
          # Verify the change
          echo "Modified backstop config:"
          grep -A 1 -B 1 "${TEST_PARAM}" tests/backstop/config.js
      
      - name: Create results directory
        run: |
          mkdir -p test-results/${{ needs.setup.outputs.test_parameter }}/${{ matrix.value }}
      
      - name: Build Storybook
        run: |
          # Build Storybook with VRT flag (same as in visual-regression.yml)
          VRT=1 npm run build:storybook
      
      - name: Run tests (3 iterations)
        run: |
          # Run 3 iterations of the test
          for i in {1..3}; do
            echo "=== Starting test run #$i for ${{ needs.setup.outputs.test_parameter }}=${{ matrix.value }} ==="
            
            # Run the test and capture start/end time and output
            TEST_START_TIME=$(date +%s%3N)
            # Use the npm script instead of directly calling backstop and capture output
            TEST_OUTPUT_FILE="test-results/${{ needs.setup.outputs.test_parameter }}/${{ matrix.value }}/output-run-$i.txt"
            TEST_STATUS=0
            
            # Run the test and capture both stdout and stderr
            npm run -w tests/backstop backstopjs -- test > "$TEST_OUTPUT_FILE" 2>&1 || TEST_STATUS=$?
            
            TEST_END_TIME=$(date +%s%3N)
            TEST_DURATION=$((TEST_END_TIME - TEST_START_TIME))
            
            # Copy the JSON report to our results directory if it exists
            if [ -f "tests/backstop/json_report/report.json" ]; then
              cp tests/backstop/json_report/report.json test-results/${{ needs.setup.outputs.test_parameter }}/${{ matrix.value }}/report-run-$i.json
            else
              echo "{\"error\": \"No report generated\"}" > test-results/${{ needs.setup.outputs.test_parameter }}/${{ matrix.value }}/report-run-$i.json
            fi
            
            # Extract error message if test failed
            ERROR_MSG=""
            if [ $TEST_STATUS -ne 0 ]; then
              # Extract the error message from the output
              ERROR_MSG=$(grep -A 10 "Error:" "$TEST_OUTPUT_FILE" | head -n 10 | sed 's/"/\\"/g' | tr '\n' ' ')
            fi
            
            # Create a summary for this run including status and error
            echo "{\"run\": $i, \"parameter\": \"${{ needs.setup.outputs.test_parameter }}\", \"value\": ${{ matrix.value }}, \"duration_ms\": $TEST_DURATION, \"status\": $TEST_STATUS, \"error\": \"$ERROR_MSG\"}" > test-results/${{ needs.setup.outputs.test_parameter }}/${{ matrix.value }}/summary-run-$i.json
            
            echo "=== Completed test run #$i in ${TEST_DURATION}ms with status $TEST_STATUS ==="
          done
      
      - name: Upload results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: backstop-test-results-${{ needs.setup.outputs.test_parameter }}-${{ matrix.value }}
          path: test-results/${{ needs.setup.outputs.test_parameter }}/${{ matrix.value }}/
          retention-days: 1

  # Process and commit results
  process-results:
    name: Process Test Results
    needs: [setup, run-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # For committing results back to repo
    
    steps:
      - uses: actions/checkout@v4
        with:
          ref: backstop-test-results
          fetch-depth: 1
      
      - name: Create results directory if it doesn't exist
        run: |
          mkdir -p backstop-test-results/${{ needs.setup.outputs.test_parameter }}
      
      - name: Download all test results
        uses: actions/download-artifact@v4
        with:
          path: temp-artifacts
      
      - name: Process results
        run: |
          # Install jq for JSON processing
          sudo apt-get update
          sudo apt-get install -y jq
          
          # Create results array
          echo "[]" > backstop-test-results/${{ needs.setup.outputs.test_parameter }}/results.json
          
          # Process each value's results
          for value_dir in temp-artifacts/backstop-test-results-${{ needs.setup.outputs.test_parameter }}-*; do
            value=$(basename "$value_dir" | sed "s/backstop-test-results-${{ needs.setup.outputs.test_parameter }}-//")
            
            # Process the 3 runs for this value
            for run_file in "$value_dir"/summary-run-*.json; do
              # Add this run's data to the results array
              jq -s '.[0] + [.[1]]' backstop-test-results/${{ needs.setup.outputs.test_parameter }}/results.json "$run_file" > temp.json
              mv temp.json backstop-test-results/${{ needs.setup.outputs.test_parameter }}/results.json
            done
          done
          
          # Generate CSV from JSON with status and error information
          echo "parameter,value,run,duration_ms,status,error" > backstop-test-results/${{ needs.setup.outputs.test_parameter }}/results.csv
          jq -r '.[] | [.parameter, .value, .run, .duration_ms, .status // 0, .error // ""] | @csv' backstop-test-results/${{ needs.setup.outputs.test_parameter }}/results.json >> backstop-test-results/${{ needs.setup.outputs.test_parameter }}/results.csv
          
          # Generate summary statistics
          jq -r '.[] | .value' backstop-test-results/${{ needs.setup.outputs.test_parameter }}/results.json | sort -n | uniq > values.txt
          
          echo "# Backstop Performance Test Results for ${{ needs.setup.outputs.test_parameter }}" > backstop-test-results/${{ needs.setup.outputs.test_parameter }}/summary.md
          echo "" >> backstop-test-results/${{ needs.setup.outputs.test_parameter }}/summary.md
          echo "Test run at: $(date)" >> backstop-test-results/${{ needs.setup.outputs.test_parameter }}/summary.md
          echo "" >> backstop-test-results/${{ needs.setup.outputs.test_parameter }}/summary.md
          echo "## Summary" >> backstop-test-results/${{ needs.setup.outputs.test_parameter }}/summary.md
          echo "" >> backstop-test-results/${{ needs.setup.outputs.test_parameter }}/summary.md
          echo "| Value | Avg Duration (ms) | Min Duration (ms) | Max Duration (ms) | Success Rate | Failures |" >> backstop-test-results/${{ needs.setup.outputs.test_parameter }}/summary.md
          echo "|-------|------------------|------------------|------------------|-------------|----------|" >> backstop-test-results/${{ needs.setup.outputs.test_parameter }}/summary.md
          
          while read -r value; do
            # Calculate statistics for this value
            avg=$(jq -r "[.[] | select(.value == $value) | .duration_ms] | add / length" backstop-test-results/${{ needs.setup.outputs.test_parameter }}/results.json)
            min=$(jq -r "[.[] | select(.value == $value) | .duration_ms] | min" backstop-test-results/${{ needs.setup.outputs.test_parameter }}/results.json)
            max=$(jq -r "[.[] | select(.value == $value) | .duration_ms] | max" backstop-test-results/${{ needs.setup.outputs.test_parameter }}/results.json)
            
            # Calculate success rate
            total_runs=$(jq -r "[.[] | select(.value == $value)] | length" backstop-test-results/${{ needs.setup.outputs.test_parameter }}/results.json)
            successful_runs=$(jq -r "[.[] | select(.value == $value and .status == 0)] | length" backstop-test-results/${{ needs.setup.outputs.test_parameter }}/results.json)
            success_rate=$(echo "scale=2; ($successful_runs / $total_runs) * 100" | bc)
            failures=$(($total_runs - $successful_runs))
            
            # Add to summary table
            printf "| %s | %.2f | %d | %d | %.2f%% | %d |\n" "$value" "$avg" "$min" "$max" "$success_rate" "$failures" >> backstop-test-results/${{ needs.setup.outputs.test_parameter }}/summary.md
          done < values.txt
          
          # Add error details section if there were any failures
          total_failures=$(jq -r "[.[] | select(.status != 0)] | length" backstop-test-results/${{ needs.setup.outputs.test_parameter }}/results.json)
          if [ "$total_failures" -gt 0 ]; then
            echo "" >> backstop-test-results/${{ needs.setup.outputs.test_parameter }}/summary.md
            echo "## Error Details" >> backstop-test-results/${{ needs.setup.outputs.test_parameter }}/summary.md
            echo "" >> backstop-test-results/${{ needs.setup.outputs.test_parameter }}/summary.md
            echo "| Value | Run | Error |" >> backstop-test-results/${{ needs.setup.outputs.test_parameter }}/summary.md
            echo "|-------|-----|-------|" >> backstop-test-results/${{ needs.setup.outputs.test_parameter }}/summary.md
            
            # Add each error to the table
            jq -r '.[] | select(.status != 0) | [.value, .run, .error] | @tsv' backstop-test-results/${{ needs.setup.outputs.test_parameter }}/results.json | \
            while IFS=$'\t' read -r value run error; do
              printf "| %s | %s | %s |\n" "$value" "$run" "$error" >> backstop-test-results/${{ needs.setup.outputs.test_parameter }}/summary.md
            done
          fi
      
      - name: Commit results back to repository
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add backstop-test-results/
          git commit -m "Add backstop performance test results for ${{ needs.setup.outputs.test_parameter }} [skip ci]"
          git push origin backstop-test-results || git push --set-upstream origin backstop-test-results
      
      - name: Upload final results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: backstop-performance-test-results-${{ needs.setup.outputs.test_parameter }}
          path: backstop-test-results/${{ needs.setup.outputs.test_parameter }}/
